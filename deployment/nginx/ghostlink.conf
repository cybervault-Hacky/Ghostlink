# GhostLink Developer Portal — production reverse proxy (Phase 13R).
#
# SECURITY ASSUMPTIONS (read deployment/README.md):
#   * Replace example.com below with your real domain.
#   * TLS certificates are placeholders — provision real certs (e.g. via
#     certbot) and never commit private keys.
#   * Only the proxy should terminate TLS; the portal behind it binds to
#     127.0.0.1 and is not exposed directly.
#   * HSTS is only enabled after HTTPS is confirmed working.

# HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    # ---- TLS (REPLACE with real certificate paths; never commit keys) ----
    ssl_certificate     /etc/nginx/ssl/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Security headers (the app also sets these) ---------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # ---- Trusted proxy headers (must match TRUSTED_PROXIES/ALLOWED_HOSTS) -
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;

    # ---- Limits ----------------------------------------------------------
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 20s;

    # ---- Buffering -------------------------------------------------------
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Static frontend assets are cached aggressively; SPA fallback handled by
    # the backend for any non-asset path.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        proxy_pass http://127.0.0.1:8788;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
